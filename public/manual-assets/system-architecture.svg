<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Wild Agent OS 当前系统架构</title>
  <desc id="desc">展示管理端、服务接入层、智能体运行时、知识与模型资源、调试运维以及新能源车维修智能体链路。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#0f172a}
      .subtitle{font:500 16px system-ui,sans-serif;fill:#475569}
      .layer{font:700 20px system-ui,sans-serif;fill:#1e293b}
      .box-title{font:700 16px system-ui,sans-serif;fill:#0f172a}
      .text{font:13px system-ui,sans-serif;fill:#475569}
      .small{font:12px system-ui,sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;filter:url(#shadow)}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow-blue)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#background)"/>
  <text x="800" y="54" text-anchor="middle" class="title">Wild Agent OS 当前系统架构</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">Agent 开发管理、知识增强、模型路由与运行运维的统一控制面</text>

  <rect x="60" y="115" width="1480" height="105" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="90" y="148" class="layer">01 用户与接入渠道</text>
  <rect x="300" y="135" width="245" height="58" rx="10" class="card"/>
  <text x="422" y="159" text-anchor="middle" class="box-title">管理人员 / Agent 开发者</text>
  <text x="422" y="180" text-anchor="middle" class="small">浏览器访问 React 管理端</text>
  <rect x="675" y="135" width="245" height="58" rx="10" class="card"/>
  <text x="797" y="159" text-anchor="middle" class="box-title">OpenAI 兼容客户端</text>
  <text x="797" y="180" text-anchor="middle" class="small">模型列表、对话与 SSE</text>
  <rect x="1050" y="135" width="245" height="58" rx="10" class="card"/>
  <text x="1172" y="159" text-anchor="middle" class="box-title">内部系统</text>
  <text x="1172" y="180" text-anchor="middle" class="small">REST / gRPC 调用</text>

  <rect x="60" y="250" width="1480" height="150" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="90" y="284" class="layer">02 React 管理控制面</text>
  <g>
    <rect x="110" y="305" width="205" height="64" rx="10" class="card"/>
    <text x="212" y="331" text-anchor="middle" class="box-title">业务 Agent 开发</text>
    <text x="212" y="352" text-anchor="middle" class="small">Agent / Skill / Prompt / MCP</text>
    <rect x="350" y="305" width="205" height="64" rx="10" class="card"/>
    <text x="452" y="331" text-anchor="middle" class="box-title">知识中心</text>
    <text x="452" y="352" text-anchor="middle" class="small">分类 / 知识库 / 知识包 / 本体</text>
    <rect x="590" y="305" width="205" height="64" rx="10" class="card"/>
    <text x="692" y="331" text-anchor="middle" class="box-title">模型注册中心</text>
    <text x="692" y="352" text-anchor="middle" class="small">Provider / 型号 / 能力槽</text>
    <rect x="830" y="305" width="205" height="64" rx="10" class="card"/>
    <text x="932" y="331" text-anchor="middle" class="box-title">任务与运行时</text>
    <text x="932" y="352" text-anchor="middle" class="small">任务流 / 内核 / 记忆 / 批处理</text>
    <rect x="1070" y="305" width="205" height="64" rx="10" class="card"/>
    <text x="1172" y="331" text-anchor="middle" class="box-title">安全与访问</text>
    <text x="1172" y="352" text-anchor="middle" class="small">IAM / API Key / Guard / Audit</text>
    <rect x="1310" y="305" width="180" height="64" rx="10" class="card"/>
    <text x="1400" y="331" text-anchor="middle" class="box-title">平台文档</text>
    <text x="1400" y="352" text-anchor="middle" class="small">架构与操作手册</text>
  </g>

  <rect x="60" y="430" width="1480" height="115" rx="18" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="464" class="layer">03 Rust 服务接入层</text>
  <rect x="225" y="475" width="280" height="46" rx="9" class="card"/>
  <text x="365" y="504" text-anchor="middle" class="box-title">Axum REST / SSE</text>
  <rect x="555" y="475" width="280" height="46" rx="9" class="card"/>
  <text x="695" y="504" text-anchor="middle" class="box-title">OpenAI 兼容接口</text>
  <rect x="885" y="475" width="220" height="46" rx="9" class="card"/>
  <text x="995" y="504" text-anchor="middle" class="box-title">Tonic gRPC</text>
  <rect x="1155" y="475" width="220" height="46" rx="9" class="card"/>
  <text x="1265" y="504" text-anchor="middle" class="box-title">身份、RBAC 与配额</text>

  <rect x="60" y="575" width="1480" height="180" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="90" y="609" class="layer">04 Agent 运行时</text>
  <rect x="110" y="630" width="250" height="88" rx="11" class="card"/>
  <text x="235" y="658" text-anchor="middle" class="box-title">Agent 解析与能力挂载</text>
  <text x="235" y="682" text-anchor="middle" class="text">Skills / Knowledge Packs</text>
  <text x="235" y="703" text-anchor="middle" class="text">chat / vision model_mounts</text>
  <rect x="405" y="630" width="250" height="88" rx="11" class="card"/>
  <text x="530" y="658" text-anchor="middle" class="box-title">任务编排</text>
  <text x="530" y="682" text-anchor="middle" class="text">SA / PA / DA / CA / AA</text>
  <text x="530" y="703" text-anchor="middle" class="text">任务状态、SSE 与事件</text>
  <rect x="700" y="630" width="250" height="88" rx="11" class="card"/>
  <text x="825" y="658" text-anchor="middle" class="box-title">RAG 上下文构建</text>
  <text x="825" y="682" text-anchor="middle" class="text">命名图 SPARQL + 向量召回</text>
  <text x="825" y="703" text-anchor="middle" class="text">来源、命中数与降级状态</text>
  <rect x="995" y="630" width="250" height="88" rx="11" class="card"/>
  <text x="1120" y="658" text-anchor="middle" class="box-title">工具与技能执行</text>
  <text x="1120" y="682" text-anchor="middle" class="text">内置 Tool / Skill / MCP</text>
  <text x="1120" y="703" text-anchor="middle" class="text">输入输出 Schema 与准入</text>
  <rect x="1290" y="630" width="200" height="88" rx="11" class="card"/>
  <text x="1390" y="658" text-anchor="middle" class="box-title">Guard 与审计</text>
  <text x="1390" y="682" text-anchor="middle" class="text">调用检查</text>
  <text x="1390" y="703" text-anchor="middle" class="text">结果与日志</text>

  <rect x="60" y="785" width="720" height="205" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="90" y="820" class="layer">05 知识与数据资源</text>
  <rect x="100" y="845" width="195" height="105" rx="10" class="card"/>
  <text x="197" y="874" text-anchor="middle" class="box-title">知识包</text>
  <text x="197" y="898" text-anchor="middle" class="small">分类与资源组合</text>
  <text x="197" y="920" text-anchor="middle" class="small">Agent 多包挂载</text>
  <rect x="325" y="845" width="195" height="105" rx="10" class="card"/>
  <text x="422" y="874" text-anchor="middle" class="box-title">Oxigraph</text>
  <text x="422" y="898" text-anchor="middle" class="small">RDF 命名图</text>
  <text x="422" y="920" text-anchor="middle" class="small">SPARQL 查询</text>
  <rect x="550" y="845" width="195" height="105" rx="10" class="card"/>
  <text x="647" y="874" text-anchor="middle" class="box-title">Hyperspace / redb</text>
  <text x="647" y="898" text-anchor="middle" class="small">向量索引与持久配置</text>
  <text x="647" y="920" text-anchor="middle" class="small">L0-L3 记忆数据</text>

  <rect x="820" y="785" width="720" height="205" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="850" y="820" class="layer">06 模型路由与 Provider</text>
  <rect x="865" y="845" width="185" height="105" rx="10" class="card"/>
  <text x="957" y="874" text-anchor="middle" class="box-title">能力槽</text>
  <text x="957" y="898" text-anchor="middle" class="small">chat / vision</text>
  <text x="957" y="920" text-anchor="middle" class="small">资源 ID 解析</text>
  <rect x="1085" y="845" width="185" height="105" rx="10" class="card"/>
  <text x="1177" y="874" text-anchor="middle" class="box-title">模型注册表</text>
  <text x="1177" y="898" text-anchor="middle" class="small">Provider / Resource</text>
  <text x="1177" y="920" text-anchor="middle" class="small">发现、测试、热更新</text>
  <rect x="1305" y="845" width="190" height="105" rx="10" fill="#dbeafe" stroke="#60a5fa" filter="url(#shadow)"/>
  <text x="1400" y="874" text-anchor="middle" class="box-title">Sapiens AI</text>
  <text x="1400" y="898" text-anchor="middle" class="small">Agnes 模型</text>
  <text x="1400" y="920" text-anchor="middle" class="small">OpenAI 兼容 API</text>

  <path d="M422 193V250" class="line"/>
  <path d="M797 193V430" class="line"/>
  <path d="M1172 193V430" class="line"/>
  <path d="M800 400V430" class="line"/>
  <path d="M800 545V575" class="line"/>
  <path d="M825 718V785" class="line"/>
  <path d="M1120 718V785" class="line"/>
  <path d="M295 897H325" class="line"/>
  <path d="M1050 897H1085" class="line"/>
  <path d="M1270 897H1305" class="line"/>

  <rect x="60" y="1020" width="1480" height="70" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="1049" class="box-title">新能源车维修业务链路</text>
  <text x="90" y="1074" class="text">维修用户 → 新能源车维修智能体 → 6 项业务 Skill → 全量维修知识包（2,213 来源页 / 2,033 归并记录 / 91,494 三元组）→ Agnes 模型 → 有依据回答与审计</text>
</svg>
